<form class="catalog-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <app-input
    label="Nombre de la Facultad"
    placeholder="Ej: Facultad de Ingeniería"
    [value]="nameControl.value ?? ''"
    [required]="true"
    [showErrors]="nameControl.touched"
    [errorMessage]="nameError"
    (valueChange)="nameControl.setValue($event.toString()); nameControl.markAsTouched()">
  </app-input>

  <app-input
    label="Código"
    placeholder="Ej: FI"
    [value]="codeControl.value ?? ''"
    [required]="true"
    [showErrors]="codeControl.touched"
    [errorMessage]="codeError"
    (valueChange)="codeControl.setValue($event.toString()); codeControl.markAsTouched()">
  </app-input>

  <div class="form-actions">
    <app-button variant="secondary" type="button" (clicked)="onCancel()">Cancelar</app-button>
    <app-button variant="primary" type="submit">Guardar</app-button>
  </div>
</form>
